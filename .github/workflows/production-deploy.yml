name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type deploy to authorize production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xlink-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'deploy' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, xlink-production]
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify Laravel 13 baseline and live Nginx target
        shell: bash
        run: |
          set -euo pipefail
          php8.5 -r '
            $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $framework = null;
            foreach (($lock["packages"] ?? []) as $package) {
                if (($package["name"] ?? null) === "laravel/framework") {
                    $framework = $package["version"] ?? null;
                    break;
                }
            }
            if (($manifest["require"]["php"] ?? null) !== "^8.5" ||
                ($manifest["require"]["laravel/framework"] ?? null) !== "^13.0" ||
                ! is_string($framework) || ! str_starts_with($framework, "v13.")) {
                fwrite(STDERR, "Refusing deployment: release dependencies are not on the Laravel 13 / PHP 8.5 baseline.\\n");
                exit(1);
            }
            echo "Candidate baseline: Laravel {$framework}; PHP {$manifest["require"]["php"]}\\n";
          '
          APP_PATH=/var/www/isp-billing-import
          LIVE_ROOT="$(nginx -T 2>/dev/null | python3 -c '
          import re, sys
          config = sys.stdin.read()
          blocks = re.findall(r"(?ms)^server\\s*\\{(.*?)^\\}", config)
          for block in blocks:
              if "bill.xlinkbd.net" not in block:
                  continue
              if not re.search(r"(?m)^\\s*listen\\s+443(?:\\s|;)", block):
                  continue
              if "/run/php/php8.5-fpm.sock" not in block:
                  continue
              root = re.search(r"(?m)^\\s*root\\s+([^;]+);", block)
              if root:
                  print(root.group(1).strip())
                  break
          ')"
          TARGET_ROOT="$(realpath "$APP_PATH")/public"
          if [[ -z "$LIVE_ROOT" || "$LIVE_ROOT" != "$TARGET_ROOT" ]]; then
            echo "::error::Refusing deployment: Nginx serves '$LIVE_ROOT' but the legacy deploy helper targets '$TARGET_ROOT'. The release target must be aligned before production deployment."
            exit 1
          fi

      - name: Verify production target and clean state
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=/var/www/isp-billing-import
          test -d "$APP_PATH/.git" || test -f "$APP_PATH/.git"
          test -f "$APP_PATH/.env"
          test -f "$APP_PATH/artisan"
          php8.5 -v | head -1
          php8.5 "$(command -v composer)" --version

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run release tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          TELESCOPE_ENABLED: false
        run: |
          php8.5 "$(command -v composer)" install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php8.5 artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php8.5 artisan migrate --force
          php8.5 artisan test --no-ansi
          php8.5 artisan config:cache
          php8.5 artisan route:cache
          php8.5 artisan view:cache
          php8.5 artisan optimize:clear

      - name: Deploy tested main release through restricted root wrapper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          printf '%s\n' "${GITHUB_SHA}" > "$GITHUB_WORKSPACE/.xlink-deploy-sha"
          sudo /usr/local/sbin/xlink-billing-deploy

      - name: Verify production HTTP health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8081/login >/dev/null
          echo 'Production login endpoint returned HTTP 200.'
