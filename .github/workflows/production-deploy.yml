name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type deploy to authorize production deployment'
        required: true
        type: string
      run_migrations:
        description: 'Run pending Production DB migrations (requires separate approval)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xlink-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'deploy' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, xlink-production]
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify Laravel 13 baseline
        shell: bash
        run: |
          set -euo pipefail
          php8.5 -r '
            $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            $framework = null;
            foreach (($lock["packages"] ?? []) as $package) {
                if (($package["name"] ?? null) === "laravel/framework") {
                    $framework = $package["version"] ?? null;
                    break;
                }
            }
            if (($manifest["require"]["php"] ?? null) !== "^8.5" ||
                ($manifest["require"]["laravel/framework"] ?? null) !== "^13.0" ||
                ! is_string($framework) || ! str_starts_with($framework, "v13.")) {
                fwrite(STDERR, "Refusing deployment: release dependencies are not on the Laravel 13 / PHP 8.5 baseline.\n");
                exit(1);
            }
            echo "Candidate baseline: Laravel " . $framework . "; PHP " . $manifest["require"]["php"] . PHP_EOL;
          '

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate deploy helper cache permissions (isolated)
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/xlink-billing-deploy
          bash ops/xlink-billing-deploy --self-test-cache-permissions

      - name: Run isolated release tests and cache preflight
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          MAIL_MAILER: array
          TELESCOPE_ENABLED: false
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          php8.5 "$(command -v composer)" install --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          php8.5 artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php8.5 artisan migrate --force
          php8.5 vendor/bin/phpunit
          php8.5 artisan optimize:clear
          php8.5 artisan config:cache
          php8.5 artisan route:cache
          php8.5 artisan view:cache

      - name: Install the tested deployment helper on the production runner
        shell: bash
        run: |
          set -euo pipefail
          sudo -n install -o root -g root -m 0750 ops/xlink-billing-deploy /usr/local/sbin/xlink-billing-deploy
          sudo -n cmp --silent ops/xlink-billing-deploy /usr/local/sbin/xlink-billing-deploy

      - name: Verify release-based production layout and root-owned deploy helper
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/sbin/xlink-billing-preflight

      - name: Deploy tested main release through release-aware root helper
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main"
          printf '%s\n' "${GITHUB_SHA}" > "$GITHUB_WORKSPACE/.xlink-deploy-sha"
          if [[ "${{ inputs.run_migrations }}" == "true" ]]; then
            printf 'yes\n' > "$GITHUB_WORKSPACE/.xlink-run-migrations"
          else
            rm -f "$GITHUB_WORKSPACE/.xlink-run-migrations"
          fi
          sudo -n /usr/local/sbin/xlink-billing-deploy

      - name: Verify production HTTPS endpoint and active Laravel release
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --fail --max-time 25 --retry 2 --retry-delay 2 --resolve bill.xlinkbd.net:443:127.0.0.1 --location --output /dev/null --write-out '%{http_code}' https://bill.xlinkbd.net/login)"
          test "$HTTP_CODE" = "200"
          APP_VERSION="$(php8.5 /var/www/isp-billing-releases/current/artisan --version)"
          grep -q 'Laravel Framework 13\.' <<<"$APP_VERSION"
          echo "Verified HTTPS login endpoint and active release: $APP_VERSION"
